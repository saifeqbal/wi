
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neon Snake Arcade</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts & Font Awesome Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: #050814;
            color: #f3f4f6;
            touch-action: manipulation;
            overflow: hidden;
        }

        .arcade-font {
            font-family: 'Press Start 2P', monospace;
        }

        .scanlines {
            background: linear-gradient(
                rgba(18, 16, 16, 0) 50%, 
                rgba(0, 0, 0, 0.3) 50%
            ), linear-gradient(
                90deg,
                rgba(255, 0, 0, 0.02),
                rgba(0, 255, 0, 0.01),
                rgba(0, 0, 255, 0.02)
            );
            background-size: 100% 4px, 4px 100%;
            pointer-events: none;
        }

        .overlay-glass {
            background: rgba(5, 8, 20, 0.92);
            backdrop-filter: blur(12px);
        }

        .btn-action {
            transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .btn-action:active {
            transform: scale(0.96);
        }
    </style>
</head>
<body class="w-screen h-screen flex flex-col justify-between items-center p-2 sm:p-4 select-none">

    <!-- Top Header & Score Dashboard -->
    <header class="w-full max-w-2xl flex items-center justify-between bg-slate-900/90 border border-slate-800 px-4 py-2.5 rounded-2xl shadow-2xl z-10">
        <div class="flex items-center gap-3">
            <div id="theme-logo" class="w-9 h-9 rounded-xl bg-emerald-500/20 border border-emerald-500/50 flex items-center justify-center text-emerald-400 text-lg shadow-lg">
                <i class="fa-solid fa-staff-snake"></i>
            </div>
            <div>
                <h1 class="text-base sm:text-lg font-black tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-emerald-400 to-cyan-400">
                    NEON SNAKE
                </h1>
                <p id="difficulty-badge" class="text-[10px] text-slate-400 uppercase tracking-widest font-semibold">Medium Speed</p>
            </div>
        </div>

        <!-- Scores Display -->
        <div class="flex items-center gap-4 sm:gap-8">
            <div class="text-center">
                <span class="text-[10px] uppercase tracking-wider text-slate-400 block font-bold">Score</span>
                <span id="score-display" class="arcade-font text-emerald-400 text-lg sm:text-xl">0</span>
            </div>
            <div class="text-center">
                <span class="text-[10px] uppercase tracking-wider text-slate-400 block font-bold">High</span>
                <span id="highscore-display" class="arcade-font text-amber-400 text-lg sm:text-xl">0</span>
            </div>
        </div>

        <!-- Utility Buttons -->
        <div class="flex items-center gap-1.5">
            <button id="theme-toggle" class="w-9 h-9 rounded-xl bg-slate-800 border border-slate-700 flex items-center justify-center text-slate-300 hover:text-white transition" title="Change Theme">
                <i class="fa-solid fa-palette text-xs"></i>
            </button>
            <button id="audio-toggle" class="w-9 h-9 rounded-xl bg-slate-800 border border-slate-700 flex items-center justify-center text-slate-300 hover:text-white transition" title="Toggle Sound">
                <i class="fa-solid fa-volume-high text-xs"></i>
            </button>
        </div>
    </header>

    <!-- Game Canvas Screen Container -->
    <main class="relative w-full max-w-2xl aspect-square flex items-center justify-center my-auto">
        <div class="w-full h-full rounded-2xl p-2 bg-slate-950 border-2 border-slate-800 relative overflow-hidden flex items-center justify-center shadow-2xl">
            
            <!-- Canvas Object -->
            <canvas id="gameCanvas" class="w-full h-full block rounded-xl bg-slate-950"></canvas>
            
            <!-- Active Powerup Indicators HUD -->
            <div id="powerup-hud" class="absolute top-4 left-4 flex flex-col gap-1.5 z-20 pointer-events-none"></div>

            <!-- Scanlines Retro Filter -->
            <div class="absolute inset-0 scanlines rounded-xl"></div>

            <!-- START MENU OVERLAY -->
            <div id="start-screen" class="absolute inset-0 overlay-glass rounded-xl flex flex-col items-center justify-center p-6 text-center z-30">
                <div class="w-16 h-16 mb-3 rounded-2xl bg-emerald-500/20 border border-emerald-400/40 flex items-center justify-center text-emerald-400 text-3xl animate-bounce">
                    <i class="fa-solid fa-staff-snake"></i>
                </div>
                <h2 class="text-2xl sm:text-3xl font-black text-white mb-1 tracking-wider">NEON SNAKE ARCADE</h2>
                <p class="text-slate-400 text-xs sm:text-sm max-w-xs mb-5">Classic arcade snake reimagined with vibrant power-ups and glowing particle dynamics.</p>

                <!-- Difficulty Selector -->
                <div class="mb-5 w-full max-w-xs">
                    <span class="text-[11px] text-slate-400 block mb-2 uppercase tracking-wider font-semibold">Speed Difficulty</span>
                    <div class="grid grid-cols-3 gap-2">
                        <button class="diff-btn px-2 py-2 rounded-xl text-xs font-bold border border-slate-700 bg-slate-900 text-slate-300 transition" data-diff="easy">Easy</button>
                        <button class="diff-btn px-2 py-2 rounded-xl text-xs font-bold border border-emerald-500 bg-emerald-500/20 text-emerald-300 transition" data-diff="medium">Medium</button>
                        <button class="diff-btn px-2 py-2 rounded-xl text-xs font-bold border border-slate-700 bg-slate-900 text-slate-300 transition" data-diff="hard">Hard</button>
                    </div>
                </div>

                <!-- Color Theme Selector -->
                <div class="mb-6 w-full max-w-xs">
                    <span class="text-[11px] text-slate-400 block mb-2 uppercase tracking-wider font-semibold">Visual Color Theme</span>
                    <div class="grid grid-cols-3 gap-2">
                        <button class="theme-btn px-2 py-1.5 rounded-xl text-xs font-semibold border border-emerald-500 bg-emerald-500/20 text-emerald-300" data-theme="emerald">Emerald</button>
                        <button class="theme-btn px-2 py-1.5 rounded-xl text-xs font-semibold border border-slate-700 bg-slate-900 text-slate-300" data-theme="cyberpunk">Cyberpunk</button>
                        <button class="theme-btn px-2 py-1.5 rounded-xl text-xs font-semibold border border-slate-700 bg-slate-900 text-slate-300" data-theme="sunset">Sunset</button>
                    </div>
                </div>

                <button id="start-btn" class="btn-action w-full max-w-xs py-3.5 bg-gradient-to-r from-emerald-400 to-teal-500 text-slate-950 font-black rounded-xl hover:opacity-90 text-sm uppercase tracking-wider flex items-center justify-center gap-2 shadow-lg shadow-emerald-500/20">
                    <i class="fa-solid fa-play"></i> Start Game
                </button>
            </div>

            <!-- PAUSE OVERLAY -->
            <div id="pause-screen" class="absolute inset-0 overlay-glass rounded-xl flex flex-col items-center justify-center p-6 text-center z-30 hidden">
                <i class="fa-solid fa-circle-pause text-emerald-400 text-5xl mb-3 animate-pulse"></i>
                <h2 class="text-2xl font-bold text-white mb-6">Game Paused</h2>
                <div class="flex flex-col gap-3 w-48">
                    <button id="resume-btn" class="btn-action py-3 bg-emerald-500 text-slate-950 font-bold rounded-xl hover:bg-emerald-400 uppercase tracking-wider text-sm flex items-center justify-center gap-2">
                        <i class="fa-solid fa-play"></i> Resume
                    </button>
                    <button id="quit-btn" class="py-3 bg-slate-800 border border-slate-700 text-slate-300 font-bold rounded-xl hover:bg-slate-700 uppercase tracking-wider text-sm flex items-center justify-center gap-2">
                        <i class="fa-solid fa-house"></i> Main Menu
                    </button>
                </div>
            </div>

            <!-- GAME OVER OVERLAY -->
            <div id="gameover-screen" class="absolute inset-0 overlay-glass rounded-xl flex flex-col items-center justify-center p-6 text-center z-30 hidden">
                <div class="w-16 h-16 mb-3 rounded-full bg-rose-500/20 border border-rose-500/40 flex items-center justify-center text-rose-400 text-3xl">
                    <i class="fa-solid fa-skull"></i>
                </div>
                <h2 class="text-3xl font-black text-rose-500 mb-1">GAME OVER</h2>
                <p id="final-score-text" class="text-slate-300 text-sm mb-6">You scored <span class="text-emerald-400 font-bold">0</span> points</p>

                <div class="flex gap-3">
                    <button id="restart-btn" class="btn-action px-6 py-3 bg-emerald-500 text-slate-950 font-black rounded-xl hover:bg-emerald-400 uppercase tracking-wider text-xs sm:text-sm flex items-center gap-2">
                        <i class="fa-solid fa-rotate-right"></i> Play Again
                    </button>
                    <button id="menu-btn" class="px-6 py-3 bg-slate-800 border border-slate-700 text-slate-300 font-bold rounded-xl hover:bg-slate-700 uppercase tracking-wider text-xs sm:text-sm flex items-center gap-2">
                        <i class="fa-solid fa-house"></i> Menu
                    </button>
                </div>
            </div>
        </div>
    </main>

    <!-- Bottom Controls Footer & Touch D-Pad -->
    <footer class="w-full max-w-2xl flex flex-col items-center gap-2 z-10">
        <!-- Touch Controls D-Pad (Visible on mobile/touch screens) -->
        <div class="sm:hidden grid grid-cols-3 gap-1.5 w-44">
            <div></div>
            <button id="btn-up" class="btn-action h-11 bg-slate-800/90 border border-slate-700 rounded-xl flex items-center justify-center text-cyan-400 text-lg active:bg-cyan-500 active:text-slate-950">
                <i class="fa-solid fa-arrow-up"></i>
            </button>
            <div></div>
            <button id="btn-left" class="btn-action h-11 bg-slate-800/90 border border-slate-700 rounded-xl flex items-center justify-center text-cyan-400 text-lg active:bg-cyan-500 active:text-slate-950">
                <i class="fa-solid fa-arrow-left"></i>
            </button>
            <button id="btn-down" class="btn-action h-11 bg-slate-800/90 border border-slate-700 rounded-xl flex items-center justify-center text-cyan-400 text-lg active:bg-cyan-500 active:text-slate-950">
                <i class="fa-solid fa-arrow-down"></i>
            </button>
            <button id="btn-right" class="btn-action h-11 bg-slate-800/90 border border-slate-700 rounded-xl flex items-center justify-center text-cyan-400 text-lg active:bg-cyan-500 active:text-slate-950">
                <i class="fa-solid fa-arrow-right"></i>
            </button>
        </div>

        <!-- Shortcut info and Pause trigger -->
        <div class="w-full flex justify-between items-center px-1 text-[11px] text-slate-400">
            <span class="hidden sm:inline"><strong class="text-slate-200">Arrow / WASD Keys</strong> to move • <strong class="text-slate-200">Space</strong> to Pause</span>
            <span class="sm:hidden">Swipe or D-Pad to steer</span>
            <button id="pause-toggle-btn" class="px-3 py-1 rounded-lg bg-slate-900 border border-slate-800 text-slate-300 hover:text-white text-xs font-semibold flex items-center gap-1.5 transition">
                <i class="fa-solid fa-pause"></i> Pause
            </button>
        </div>
    </footer>

    <script>
        // Game Canvas Setup
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // UI Element References
        const scoreDisplay = document.getElementById('score-display');
        const highscoreDisplay = document.getElementById('highscore-display');
        const diffBadge = document.getElementById('difficulty-badge');
        const powerupHud = document.getElementById('powerup-hud');
        
        const startScreen = document.getElementById('start-screen');
        const pauseScreen = document.getElementById('pause-screen');
        const gameoverScreen = document.getElementById('gameover-screen');
        const finalScoreText = document.getElementById('final-score-text');

        const startBtn = document.getElementById('start-btn');
        const resumeBtn = document.getElementById('resume-btn');
        const quitBtn = document.getElementById('quit-btn');
        const restartBtn = document.getElementById('restart-btn');
        const menuBtn = document.getElementById('menu-btn');
        const pauseToggleBtn = document.getElementById('pause-toggle-btn');
        const audioToggleBtn = document.getElementById('audio-toggle');
        const themeToggleBtn = document.getElementById('theme-toggle');

        const diffBtns = document.querySelectorAll('.diff-btn');
        const themeBtns = document.querySelectorAll('.theme-btn');

        // Touch Control Buttons
        const btnUp = document.getElementById('btn-up');
        const btnDown = document.getElementById('btn-down');
        const btnLeft = document.getElementById('btn-left');
        const btnRight = document.getElementById('btn-right');

        // Constants & Configuration
        const GRID_SIZE = 20; // 20x20 Grid
        let CANVAS_SIZE = 600;

        // Theme Definitions
        const THEMES = {
            emerald: {
                name: 'Emerald',
                head: '#10b981',
                body: '#34d399',
                food: '#f43f5e',
                grid: 'rgba(16, 185, 129, 0.05)',
                glow: '#10b981',
                badgeBg: 'bg-emerald-500/20'
            },
            cyberpunk: {
                name: 'Cyberpunk',
                head: '#06b6d4',
                body: '#38bdf8',
                food: '#f43f5e',
                grid: 'rgba(6, 182, 212, 0.05)',
                glow: '#06b6d4',
                badgeBg: 'bg-cyan-500/20'
            },
            sunset: {
                name: 'Sunset',
                head: '#f59e0b',
                body: '#fbbf24',
                food: '#a855f7',
                grid: 'rgba(245, 158, 11, 0.05)',
                glow: '#f59e0b',
                badgeBg: 'bg-amber-500/20'
            }
        };

        // Game Speed Settings (Interval in ms)
        const SPEED_SETTINGS = {
            easy: 120,
            medium: 85,
            hard: 55
        };

        // Power-Up Types Config
        const POWERUP_TYPES = {
            bonus: { name: '2x Points', color: '#f59e0b', icon: 'fa-star', duration: 8000 },
            speed: { name: 'Speed Surge', color: '#3b82f6', icon: 'fa-bolt', duration: 6000 },
            ghost: { name: 'Ghost Mode', color: '#a855f7', icon: 'fa-ghost', duration: 7000 }
        };

        // Game State Variables
        let currentTheme = 'emerald';
        let difficulty = 'medium';
        let audioEnabled = true;

        let isRunning = false;
        let isPaused = false;
        let score = 0;
        let highScore = parseInt(localStorage.getItem('snake_highscore') || '0');

        let snake = [];
        let dir = { x: 1, y: 0 };
        let nextDir = { x: 1, y: 0 };
        
        let food = { x: 0, y: 0, type: 'normal' };
        let activePowerup = null; // { type, endTime }
        let activePowerupTimer = null;

        let particles = [];
        let lastStepTime = 0;

        // Initialize Canvas Resolution
        function resizeCanvas() {
            CANVAS_SIZE = Math.min(600, canvas.parentElement.clientWidth - 16);
            canvas.width = CANVAS_SIZE;
            canvas.height = CANVAS_SIZE;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        highscoreDisplay.textContent = highScore;

        let audioCtx = null;
        function initAudio() {
            if (!audioCtx) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                audioCtx = new AudioContext();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playSound(type) {
            if (!audioEnabled) return;
            initAudio();
            if (!audioCtx) return;

            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                const now = audioCtx.currentTime;

                if (type === 'eat') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(400, now);
                    osc.frequency.exponentialRampToValueAtTime(800, now + 0.08);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
                    osc.start(now);
                    osc.stop(now + 0.08);
                } else if (type === 'powerup') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(300, now);
                    osc.frequency.exponentialRampToValueAtTime(900, now + 0.2);
                    gain.gain.setValueAtTime(0.25, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
                    osc.start(now);
                    osc.stop(now + 0.2);
                } else if (type === 'die') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(300, now);
                    osc.frequency.exponentialRampToValueAtTime(80, now + 0.35);
                    gain.gain.setValueAtTime(0.3, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.35);
                    osc.start(now);
                    osc.stop(now + 0.35);
                }
            } catch (e) {
                // Audio safety catch
            }
        }

        function spawnFood() {
            let valid = false;
            let fx, fy;

            while (!valid) {
                fx = Math.floor(Math.random() * GRID_SIZE);
                fy = Math.floor(Math.random() * GRID_SIZE);
                valid = !snake.some(segment => segment.x === fx && segment.y === fy);
            }

            // 20% Chance for special powerup food
            const isPowerup = Math.random() < 0.20;
            let pType = 'normal';

            if (isPowerup) {
                const types = Object.keys(POWERUP_TYPES);
                pType = types[Math.floor(Math.random() * types.length)];
            }

            food = { x: fx, y: fy, type: pType };
        }

        function createParticles(x, y, color) {
            const tileSize = CANVAS_SIZE / GRID_SIZE;
            const px = (x + 0.5) * tileSize;
            const py = (y + 0.5) * tileSize;

            for (let i = 0; i < 15; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 3 + 1;
                particles.push({
                    x: px,
                    y: py,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    life: 1.0,
                    color: color,
                    size: Math.random() * 4 + 2
                });
            }
        }

        function updateParticles() {
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.life -= 0.04;
                if (p.life <= 0) {
                    particles.splice(i, 1);
                }
            }
        }

        function startMatch() {
            score = 0;
            scoreDisplay.textContent = '0';

            // Reset Snake Position at Center
            snake = [
                { x: 10, y: 10 },
                { x: 9, y: 10 },
                { x: 8, y: 10 }
            ];
            dir = { x: 1, y: 0 };
            nextDir = { x: 1, y: 0 };

            activePowerup = null;
            particles = [];
            updatePowerupHUD();

            spawnFood();

            startScreen.classList.add('hidden');
            pauseScreen.classList.add('hidden');
            gameoverScreen.classList.add('hidden');

            isRunning = true;
            isPaused = false;
            lastStepTime = performance.now();
        }

        function togglePause() {
            if (!isRunning) return;
            isPaused = !isPaused;
            if (isPaused) {
                pauseScreen.classList.remove('hidden');
            } else {
                pauseScreen.classList.add('hidden');
                lastStepTime = performance.now();
            }
        }

        function triggerGameOver() {
            isRunning = false;
            playSound('die');

            if (score > highScore) {
                highScore = score;
                localStorage.setItem('snake_highscore', highScore.toString());
                highscoreDisplay.textContent = highScore;
            }

            finalScoreText.innerHTML = `You scored <span class="text-emerald-400 font-bold">${score}</span> points`;
            gameoverScreen.classList.remove('hidden');
        }

        function updatePowerupHUD() {
            powerupHud.innerHTML = '';
            if (activePowerup) {
                const cfg = POWERUP_TYPES[activePowerup.type];
                const badge = document.createElement('div');
                badge.className = 'px-3 py-1 rounded-full bg-slate-900/90 border border-slate-700 text-xs font-bold flex items-center gap-2 shadow-lg';
                badge.style.color = cfg.color;
                badge.innerHTML = `<i class="fa-solid ${cfg.icon}"></i> ${cfg.name}`;
                powerupHud.appendChild(badge);
            }
        }

        function step() {
            dir = { ...nextDir };
            const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

            const isGhost = activePowerup && activePowerup.type === 'ghost';

            // Handle Wall Collisions
            if (head.x < 0 || head.x >= GRID_SIZE || head.y < 0 || head.y >= GRID_SIZE) {
                if (isGhost) {
                    // Wrap around walls in Ghost Mode
                    head.x = (head.x + GRID_SIZE) % GRID_SIZE;
                    head.y = (head.y + GRID_SIZE) % GRID_SIZE;
                } else {
                    triggerGameOver();
                    return;
                }
            }

            // Self-Collision Check
            if (snake.some(segment => segment.x === head.x && segment.y === head.y)) {
                triggerGameOver();
                return;
            }

            snake.unshift(head);

            // Food Collisions Check
            if (head.x === food.x && head.y === food.y) {
                const themeConfig = THEMES[currentTheme];

                if (food.type === 'normal') {
                    const points = (activePowerup && activePowerup.type === 'bonus') ? 20 : 10;
                    score += points;
                    playSound('eat');
                    createParticles(food.x, food.y, themeConfig.food);
                } else {
                    // Activate Powerup
                    activePowerup = {
                        type: food.type,
                        endTime: Date.now() + POWERUP_TYPES[food.type].duration
                    };
                    score += 25;
                    playSound('powerup');
                    createParticles(food.x, food.y, POWERUP_TYPES[food.type].color);
                    updatePowerupHUD();
                }

                scoreDisplay.textContent = score;
                spawnFood();
            } else {
                snake.pop(); // Remove tail
            }

            // Check Powerup Expiration
            if (activePowerup && Date.now() > activePowerup.endTime) {
                activePowerup = null;
                updatePowerupHUD();
            }
        }

        function draw() {
            const tileSize = CANVAS_SIZE / GRID_SIZE;
            const themeConfig = THEMES[currentTheme];

            // Clear Background
            ctx.fillStyle = '#050814';
            ctx.fillRect(0, 0, CANVAS_SIZE, CANVAS_SIZE);

            // Draw Subtle Grid Lines
            ctx.strokeStyle = themeConfig.grid;
            ctx.lineWidth = 1;
            for (let i = 0; i <= GRID_SIZE; i++) {
                ctx.beginPath();
                ctx.moveTo(i * tileSize, 0);
                ctx.lineTo(i * tileSize, CANVAS_SIZE);
                ctx.stroke();

                ctx.beginPath();
                ctx.moveTo(0, i * tileSize);
                ctx.lineTo(CANVAS_SIZE, i * tileSize);
                ctx.stroke();
            }

            // Draw Particles
            particles.forEach(p => {
                ctx.save();
                ctx.globalAlpha = p.life;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            });

            // Draw Food
            ctx.save();
            const foodX = food.x * tileSize + tileSize / 2;
            const foodY = food.y * tileSize + tileSize / 2;
            const foodRadius = tileSize / 2.5;

            if (food.type === 'normal') {
                ctx.shadowColor = themeConfig.food;
                ctx.shadowBlur = 12;
                ctx.fillStyle = themeConfig.food;
                ctx.beginPath();
                ctx.arc(foodX, foodY, foodRadius, 0, Math.PI * 2);
                ctx.fill();
            } else {
                // Powerup Food Item
                const pConfig = POWERUP_TYPES[food.type];
                ctx.shadowColor = pConfig.color;
                ctx.shadowBlur = 15;
                ctx.fillStyle = pConfig.color;
                ctx.beginPath();
                ctx.arc(foodX, foodY, foodRadius * 1.1, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.restore();

            // Draw Snake Segments
            const isGhost = activePowerup && activePowerup.type === 'ghost';
            snake.forEach((segment, index) => {
                ctx.save();
                const sx = segment.x * tileSize;
                const sy = segment.y * tileSize;

                if (index === 0) {
                    // Head Segment
                    ctx.shadowColor = isGhost ? '#a855f7' : themeConfig.glow;
                    ctx.shadowBlur = 15;
                    ctx.fillStyle = isGhost ? '#a855f7' : themeConfig.head;
                    ctx.beginPath();
                    ctx.roundRect(sx + 1, sy + 1, tileSize - 2, tileSize - 2, 6);
                    ctx.fill();
                } else {
                    // Body Segments
                    ctx.shadowColor = isGhost ? 'rgba(168, 85, 247, 0.4)' : themeConfig.glow;
                    ctx.shadowBlur = 6;
                    ctx.fillStyle = isGhost ? '#c084fc' : themeConfig.body;
                    ctx.beginPath();
                    ctx.roundRect(sx + 2, sy + 2, tileSize - 4, tileSize - 4, 4);
                    ctx.fill();
                }
                ctx.restore();
            });
        }

        function gameLoop(time) {
            requestAnimationFrame(gameLoop);

            updateParticles();

            if (isRunning && !isPaused) {
                let currentInterval = SPEED_SETTINGS[difficulty];
                if (activePowerup && activePowerup.type === 'speed') {
                    currentInterval = Math.floor(currentInterval * 0.6); // 40% faster
                }

                if (time - lastStepTime >= currentInterval) {
                    step();
                    lastStepTime = time;
                }
            }

            draw();
        }

        function handleDirectionChange(newDir) {
            if (!isRunning || isPaused) return;
            // Prevent 180-degree immediate reverse
            if (newDir.x === -dir.x && newDir.y === -dir.y) return;
            nextDir = newDir;
        }

        window.addEventListener('keydown', (e) => {
            switch (e.key) {
                case 'ArrowUp':
                case 'w':
                case 'W':
                    handleDirectionChange({ x: 0, y: -1 });
                    e.preventDefault();
                    break;
                case 'ArrowDown':
                case 's':
                case 'S':
                    handleDirectionChange({ x: 0, y: 1 });
                    e.preventDefault();
                    break;
                case 'ArrowLeft':
                case 'a':
                case 'A':
                    handleDirectionChange({ x: -1, y: 0 });
                    e.preventDefault();
                    break;
                case 'ArrowRight':
                case 'd':
                case 'D':
                    handleDirectionChange({ x: 1, y: 0 });
                    e.preventDefault();
                    break;
                case ' ':
                    togglePause();
                    e.preventDefault();
                    break;
            }
        });

        // Mobile D-Pad Touch Listeners
        btnUp.addEventListener('click', () => handleDirectionChange({ x: 0, y: -1 }));
        btnDown.addEventListener('click', () => handleDirectionChange({ x: 0, y: 1 }));
        btnLeft.addEventListener('click', () => handleDirectionChange({ x: -1, y: 0 }));
        btnRight.addEventListener('click', () => handleDirectionChange({ x: 1, y: 0 }));

        // Touch Swipe Gesture Detection
        let touchStartX = 0;
        let touchStartY = 0;

        canvas.addEventListener('touchstart', (e) => {
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
        }, { passive: true });

        canvas.addEventListener('touchend', (e) => {
            if (!touchStartX || !touchStartY) return;
            const diffX = e.changedTouches[0].clientX - touchStartX;
            const diffY = e.changedTouches[0].clientY - touchStartY;

            if (Math.abs(diffX) > Math.abs(diffY)) {
                if (Math.abs(diffX) > 25) {
                    handleDirectionChange(diffX > 0 ? { x: 1, y: 0 } : { x: -1, y: 0 });
                }
            } else {
                if (Math.abs(diffY) > 25) {
                    handleDirectionChange(diffY > 0 ? { x: 0, y: 1 } : { x: 0, y: -1 });
                }
            }
            touchStartX = 0;
            touchStartY = 0;
        }, { passive: true });

        diffBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                diffBtns.forEach(b => {
                    b.classList.remove('border-emerald-500', 'bg-emerald-500/20', 'text-emerald-300');
                    b.classList.add('border-slate-700', 'bg-slate-900', 'text-slate-300');
                });
                btn.classList.remove('border-slate-700', 'bg-slate-900', 'text-slate-300');
                btn.classList.add('border-emerald-500', 'bg-emerald-500/20', 'text-emerald-300');

                difficulty = btn.getAttribute('data-diff');
                diffBadge.textContent = `${difficulty.charAt(0).toUpperCase() + difficulty.slice(1)} Speed`;
            });
        });

        themeBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                themeBtns.forEach(b => {
                    b.classList.remove('border-emerald-500', 'bg-emerald-500/20', 'text-emerald-300');
                    b.classList.add('border-slate-700', 'bg-slate-900', 'text-slate-300');
                });
                btn.classList.remove('border-slate-700', 'bg-slate-900', 'text-slate-300');
                btn.classList.add('border-emerald-500', 'bg-emerald-500/20', 'text-emerald-300');

                currentTheme = btn.getAttribute('data-theme');
            });
        });

        startBtn.addEventListener('click', startMatch);
        resumeBtn.addEventListener('click', togglePause);
        pauseToggleBtn.addEventListener('click', togglePause);

        quitBtn.addEventListener('click', () => {
            isRunning = false;
            pauseScreen.classList.add('hidden');
            startScreen.classList.remove('hidden');
        });

        restartBtn.addEventListener('click', startMatch);

        menuBtn.addEventListener('click', () => {
            gameoverScreen.classList.add('hidden');
            startScreen.classList.remove('hidden');
        });

        audioToggleBtn.addEventListener('click', () => {
            audioEnabled = !audioEnabled;
            audioToggleBtn.innerHTML = audioEnabled 
                ? `<i class="fa-solid fa-volume-high text-xs"></i>`
                : `<i class="fa-solid fa-volume-xmark text-xs text-rose-400"></i>`;
        });

        themeToggleBtn.addEventListener('click', () => {
            const keys = Object.keys(THEMES);
            const nextIdx = (keys.indexOf(currentTheme) + 1) % keys.length;
            currentTheme = keys[nextIdx];
        });

        // Start Animation Loop Engine
        requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
